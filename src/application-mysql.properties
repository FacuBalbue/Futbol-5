# ==========================================================
#  Perfil "mysql": se activa con
#    mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#  Ajustá usuario y contraseña a tu instalación de MySQL 8.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/futbol5db?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.h2.console.enabled=false
