spring.application.name=futbol5-torneo
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/futbol5db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.web.resources.static-locations=file:./frontend/,classpath:/static/
spring.web.resources.cache.cachecontrol.no-cache=true

torneo.zona-horaria=America/Argentina/Buenos_Aires
